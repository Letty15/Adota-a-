<div class="pet-card">
    <div class="pet-card-img" style="background-image:url('{{ pet.foto.url }}')"></div>
    <div class="pet-card-body">
        <h3>{{ pet.nome }}</h3>
        <p class="pet-meta"><i class="bi bi-calendar3"></i> {{ pet.idade }}{% if not pet.disponivel %} · <span class="badge bg-secondary">Adotado</span>{% endif %}</p>
        <div class="pet-chips">
            <span class="chip">{{ pet.get_especie_display }}</span>
            <span class="chip">{{ pet.get_porte_display }}</span>
            <span class="chip">{{ pet.get_energia_display }}</span>
            <span class="chip">{{ pet.get_temperamento_display }}</span>
        </div>
        <a href="{% url 'detalhe_pet' pet.id %}" class="btn btn-primary-custom w-100">Ver perfil</a>
    </div>
</div>
